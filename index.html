                margin: 0.75in 1in 0.75in 1in;

            /* Force the whole page to fill the paper */

                width: 6.5in !important;
                font-size: 9pt !important;
                -webkit-print-color-adjust: exact;

            }
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 6.5in !important;

            .min-h-screen { min-height: unset !important; background: none !important; padding: 0 !important; }
            .print-container {
                width: 6.5in !important;
                max-width: 6.5in !important;
                min-height: unset !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            /* Two-column grid stays two columns */
            .print-two-col {
                display: grid !important;

            /* Suppress all Tailwind padding/margin at screen sizes */
            .p-8, .p-12, .md\:p-8, .md\:p-12 { padding: 0 !important; }
            /* Inputs become plain text in print */
            input, select, textarea {
                border: none !important;
                background: transparent !important;
                padding: 0 1px !important;
                font-size: 8.5pt !important;
                line-height: 1.3 !important;
            }
            input:placeholder-shown, textarea:placeholder-shown { display: none !important; }
            input[type="checkbox"] {
                appearance: auto !important;

                display: inline-block !important;
                width: 10px !important;
                height: 10px !important;
            }
            /* Tighten spacing */
            h1 { font-size: 14pt !important; margin-bottom: 3px !important; }
            h3 { font-size: 8pt !important; margin-bottom: 2px !important; margin-top: 5px !important; }
            h4 { font-size: 7.5pt !important; padding: 1px 4px !important; margin-bottom: 2px !important; margin-top: 3px !important; }

            .bg-yellow-50 { background-color: #fefce8 !important; }
            /* Greyed-out Shoe Rx placeholders hidden */
            .opacity-40 { display: none !important; }

            .pointer-events-none { pointer-events: auto !important; opacity: 1 !important; }
            /* Scrollbar */
            ::-webkit-scrollbar { display: none; }

// Abnormal-findings detection
//
// Input: formData + regional exam key.  Output: structured findings
// grouped by category ("Strength", "ROM", "Reflexes", etc.), suitable
// for rendering as either a narrative summary or bullet list.
//
// Rules (per clinician's spec):
//   STRENGTH / MYOTOME  -> 4-/5 or weaker prints; 4/5, 4+/5, 5/5 do not.
//   ROM (degree-based)  -> any deviation from the listed norm prints.
//   ROM (restriction)   -> Mod/Sig always prints; Mild only if 2+ Milds
//                           cluster on the same side within a subsection.
//   SPECIAL TEST        -> any "Pos" prints (with severity if recorded).
//   DTR REFLEX          -> anything not "2+" prints.
//   POS/NEG BINARY      -> "Pos" prints.
// ====================================================================

// Strength grades that are CONSIDERED ABNORMAL.  Anything 4/5 or better
// (including "4+/5") is considered within normal range per the spec.
const ABNORMAL_STRENGTH_GRADES = new Set([
  '4-/5', '3+/5', '3/5', '-3/5', '+2/5', '2/5', '-2/5', '1/5', '0/5'
]);

// Parse a ROM-norm string like "(70-80°)" or "(45°)" into [min, max] degrees.
// Returns null for empty or unparseable norm.
function parseRomNorm(normStr) {
  if (!normStr) return null;
  const s = String(normStr).replace(/[()\u00B0\s]/g, ''); // strip parens, degree sign, spaces
  if (!s) return null;
  if (s.includes('-')) {
    const [lo, hi] = s.split('-').map(Number);
    if (isNaN(lo) || isNaN(hi)) return null;
    return [lo, hi];
  }
  const v = Number(s);
  if (isNaN(v)) return null;
  return [v, v];
}

// Given a measured value string ("115", "115°") and a norm string,
// return true if the measured value is outside the norm range.
// Blank/unparseable measured -> false (nothing to compare).
function isRomDeviation(measuredStr, normStr) {
  if (!measuredStr || !String(measuredStr).trim()) return false;
  const norm = parseRomNorm(normStr);
  if (!norm) {
    // No norm specified -> any recorded value counts as "to be noted"
    // but without deviation context we return false so we don't spam.
    return false;
  }
  const measured = Number(String(measuredStr).replace(/[^\d.-]/g, ''));
  if (isNaN(measured)) return false;
  const [lo, hi] = norm;
  return measured < lo || measured > hi;
}

// Walk the FINDING_RULES config for a given exam, return array of findings.
// Each finding: { category, subsection, label, side, value, detail, severity, level }
function findAbnormalFindings(formData, examKey) {
  if (!formData || !FINDING_RULES[examKey]) return [];
  const config = FINDING_RULES[examKey];
  const findings = [];

  for (const sub of config.subsections) {
    // Pass 1: collect candidate findings per subsection. Some rules
    // (rom_restriction with Mild-cluster logic) need to see the whole
    // subsection before deciding what to emit.
    const candidates = [];

    for (const f of sub.fields) {
      if (sub.rule === 'strength') {
        // Dual-grade: _R and _L
        for (const side of ['R', 'L']) {
          const val = formData[`${f.base}_${side}`];
          if (val && ABNORMAL_STRENGTH_GRADES.has(val)) {
            candidates.push({
              category: sub.category, subsection: sub.label,
              label: f.name, side, value: val, level: f.level,
              kind: 'strength', keep: true
            });
          }
        }
      } else if (sub.rule === 'rom_degrees') {
        // Degree-based ROM.  SingleColROM stores at baseName directly,
        // otherwise ROMRow stores at baseName_R_arom/baseName_R_prom.
        if (f.singleCol) {
          const val = formData[f.base];
          if (isRomDeviation(val, f.norm)) {
            candidates.push({
              category: sub.category, subsection: sub.label,
              label: f.name, side: null,
              value: val + '°', norm: f.norm,
              kind: 'rom_degree', keep: true
            });
          }
        } else {
          for (const side of ['R', 'L']) {
            for (const ap of ['arom', 'prom']) {
              const val = formData[`${f.base}_${side}_${ap}`];
              if (isRomDeviation(val, f.norm)) {
                candidates.push({
                  category: sub.category, subsection: sub.label,
                  label: f.name, side,
                  value: `${val}° ${ap.toUpperCase()}`, norm: f.norm,
                  kind: 'rom_degree', keep: true
                });
              }
            }
          }
        }
      } else if (sub.rule === 'rom_restriction') {
        // R/L with WFL/Mild/Mod/Sig.  Collect ALL non-WFL values first,
        // then apply the Mild-cluster rule after the subsection loop.
        for (const side of ['R', 'L']) {
          const val = formData[`${f.base}_${side}`];
          if (!val || val === 'WFL') continue;
          candidates.push({
            category: sub.category, subsection: sub.label,
            label: f.name, side, value: val,
            kind: 'restriction',
            keep: (val === 'Mod' || val === 'Sig') // Mild kept conditionally below
          });
        }
      } else if (sub.rule === 'binary') {
        // R/L Pos/Neg only (no severity).  Emit any Pos.
        for (const side of ['R', 'L']) {
          const val = formData[`${f.base}_${side}`];
          if (val === 'Pos') {
            candidates.push({
              category: sub.category, subsection: sub.label,
              label: f.name, side, value: 'Positive',
              kind: 'binary', keep: true
            });
          }
        }
      } else if (sub.rule === 'special_severity') {
        // R/L Pos/Neg with optional severity (Mild/Mod/Sig)
        for (const side of ['R', 'L']) {
          const val = formData[`${f.base}_${side}`];
          if (val !== 'Pos') continue;
          const sev = formData[`${f.base}_${side}_sev`];
          candidates.push({
            category: sub.category, subsection: sub.label,
            label: f.name, side, value: 'Positive', severity: sev,
            kind: 'special', keep: true
          });
        }
      } else if (sub.rule === 'special_severity_single') {
        // Single (no R/L) Pos/Neg + severity
        const val = formData[f.base];
        if (val !== 'Pos') continue;
        const sev = formData[`${f.base}_sev`];
        candidates.push({
          category: sub.category, subsection: sub.label,
          label: f.name, side: null, value: 'Positive', severity: sev,
          kind: 'special', keep: true
        });
      } else if (sub.rule === 'dtr') {
        // Reflex grades: anything not "2+" prints
        for (const side of ['R', 'L']) {
          const val = formData[`${f.base}_${side}`];
          if (!val || val === '2+') continue;
          candidates.push({
            category: sub.category, subsection: sub.label,
            label: f.name, side, value: val, level: f.level,
            kind: 'dtr', keep: true
          });
        }
      }
    }

    // Pass 2: apply Mild-cluster rule for rom_restriction
    // A Mild is kept ONLY if there are 2+ Milds on the same side in this subsection.
    if (sub.rule === 'rom_restriction') {
      const mildBySide = { R: 0, L: 0 };
      for (const c of candidates) {
        if (c.value === 'Mild') mildBySide[c.side]++;
      }
      for (const c of candidates) {
        if (c.value === 'Mild' && mildBySide[c.side] >= 2) {
          c.keep = true;
        }
      }
    }

    for (const c of candidates) {
      if (c.keep) findings.push(c);
    }
  }
  return findings;
}

// Group a findings array by `category` for rendering. Preserves order of first
// appearance per category so output stays stable and predictable.
function groupFindingsByCategory(findings) {
  const byCat = {};
  const order = [];
  for (const f of findings) {
    if (!byCat[f.category]) {
      byCat[f.category] = [];
      order.push(f.category);
    }
    byCat[f.category].push(f);
  }
  return order.map(cat => ({ category: cat, items: byCat[cat] }));
}

// Human-readable line for a single finding.  Used in the bulleted list.
function describeFinding(f) {
  const sideStr = f.side ? (f.side === 'R' ? 'Right' : 'Left') + ' ' : '';
  switch (f.kind) {
    case 'strength':
      return `${sideStr}${f.label} weakness — ${f.value}${f.level ? ' (' + f.level + ')' : ''}`;
    case 'rom_degree':
      return `${sideStr}${f.label}${f.norm ? '' : ''} — ${f.value}${f.norm ? ' (norm ' + f.norm.replace(/[()]/g, '') + ')' : ''}`;
    case 'restriction':
      return `${sideStr}${f.label} — ${f.value} restriction`;
    case 'binary':
      return `${sideStr}${f.label} — ${f.value}`;
    case 'special':
      return `${sideStr}${f.label} — ${f.value}${f.severity ? ', ' + f.severity + ' severity' : ''}`;
    case 'dtr':
      return `${sideStr}${f.label} reflex — ${f.value}${f.level ? ' (' + f.level + ')' : ''}`;
    default:
      return `${sideStr}${f.label} — ${f.value || ''}`;
  }
}

// Short narrative summary of the 2-3 most salient findings.  Preserves
// the "hybrid" format: narrative opener, followed by full grouped bullets.
function narrativeSummary(findings) {
  if (findings.length === 0) return '';
  // Prioritize by clinical weight: Pos special tests > strength weakness
  // > DTR abnormalities > ROM issues > restrictions.
  const priority = { special: 1, binary: 2, strength: 3, dtr: 4, rom_degree: 5, restriction: 6 };
  const sorted = [...findings].sort((a, b) =>
    (priority[a.kind] || 99) - (priority[b.kind] || 99)
  );
  const top = sorted.slice(0, 3);
  // Build each clause keeping proper nouns / nerve root labels intact but
  // lowercasing only the first letter so the sentence flows naturally.
  const lcFirst = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  if (top.length === 1) {
    return `Notable finding: ${lcFirst(describeFinding(top[0]))}.`;
  }
  const phrases = top.map(f => lcFirst(describeFinding(f)));
  return `Notable findings include ${phrases.slice(0, -1).join('; ')}; and ${phrases[phrases.length - 1]}.`;
}


// ====================================================================
// Cervical exam read-only print layout
//
// Used only in preview/print mode.  Iterates the FINDING_RULES.cervical
// subsections config to render each row as clean print markup matching
// the biomechanics print style.  Subsections with no data are skipped
// entirely so the sheet stays lean.  Ends with a Local Findings summary
// (narrative opener + category-grouped bullet list).
// ====================================================================

// Does the user have ANY data for this regional exam?  If not, don't
// render the whole section at all.
function hasAnyRegionalData(formData, examKey) {
  if (!formData || !FINDING_RULES[examKey]) return false;
  const config = FINDING_RULES[examKey];
  // A section-level WFL flag counts as data — the clinician actively assessed
  // the subsection and marked all its contents as within functional limits.
  for (const sub of config.subsections) {
    if (sub.wflKey && formData[`wfl_${sub.wflKey}`]) return true;
  }
  for (const sub of config.subsections) {
    for (const f of sub.fields) {
      // Check all possible field keys for this row
      const candidates = [];
      if (sub.rule === 'strength' || sub.rule === 'rom_restriction' ||
          sub.rule === 'binary' || sub.rule === 'dtr') {
        candidates.push(`${f.base}_R`, `${f.base}_L`);
      } else if (sub.rule === 'rom_degrees') {
        if (f.singleCol) {
          candidates.push(f.base);
        } else {
          for (const s of ['R', 'L']) for (const ap of ['arom', 'prom'])
            candidates.push(`${f.base}_${s}_${ap}`);
        }
      } else if (sub.rule === 'special_severity') {
        candidates.push(`${f.base}_R`, `${f.base}_L`);
      } else if (sub.rule === 'special_severity_single') {
        candidates.push(f.base);
      }
      for (const k of candidates) {
        const v = formData[k];
        if (v && String(v).trim()) return true;
      }
    }
  }
  // Also check for notes / section-level data unique to this exam
  // Cervical-specific notes fields and gait observations
  if (examKey === 'cervical') {
    for (const k of ['cerv_final_notes', 'sp_notes']) {
      if (formData[k] && String(formData[k]).trim()) return true;
    }
  }
  return false;
}

// Tiny readable display helpers
function fmtVal(v) { return (v === null || v === undefined || v === '') ? '—' : String(v); }
function hasVal(v) { return v !== null && v !== undefined && v !== '' && String(v).trim() !== ''; }

// Render one data row for print — label on left, R and L columns on right.
// Flexes to a single column when there's no R/L (singleCol).
// Classify a display value into a clinical severity class for color tinting.
// Returns one of: 'wfl' | 'mild' | 'mod' | 'sig' | 'pos' | 'neg' | 'weak' |
// 'dtr_normal' | 'dtr_abnormal' | 'rom_deviation' | null.
//
// This drives the subtle color tint on the printed value cells so abnormal
// findings stand out visually when skimming the chart.  The classification
// is string-based because the print helpers receive already-formatted
// display strings like "Pos", "Mod", "4-/5", "Positive, Mod severity",
// "45° (norm 70-80)", "WFL", etc.
function classifyPrintValue(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s || s === '—' || s === '-') return null;

  // Explicit WFL — normal, no tint.
  if (/\bWFL\b/i.test(s)) return null;

  // Positive / Negative
  if (/^(Positive|Pos)\b/i.test(s)) return 'pos';
  // Negative is normal — no tint.
  if (/^(Negative|Neg)\b/i.test(s)) return null;

  // Severity labels (also matches "Positive, Mod severity")
  if (/\bSig(nificant)?\b/i.test(s))  return 'sig';
  if (/\bMod(erate)?\b/i.test(s))     return 'mod';
  if (/\bMild\b/i.test(s))            return 'mild';

  // Strength grades (matches "4+/5", "4/5", "4-/5", "3/5", "0/5", etc.)
  const strMatch = s.match(/^([+-]?\d)([+-]?)\/5/);
  if (strMatch) {
    const n = parseInt(strMatch[1], 10);
    const mod = strMatch[2];
    // 5/5 and 4+/5 and 4/5 are functional; below that is weak.
    if (n >= 5) return null;
    if (n === 4 && (mod === '+' || mod === '')) return null;  // 4/5 and 4+/5 normal
    if (n === 4 && mod === '-') return 'mild';                // 4-/5 mild
    if (n === 3) return mod === '+' ? 'mild' : 'mod';         // 3+/5 mild, 3/5 mod
    if (n <= 2) return 'sig';                                 // 2/5 and below = significant
    return 'mod';
  }

  // DTR grades: "2+" is normal (no tint); "0", "1+", "3+", "4+", "5+" abnormal.
  const dtrMatch = s.match(/^([0-5])([+-]?)$/);
  if (dtrMatch) {
    return dtrMatch[0] === '2+' ? null : 'dtr_abnormal';
  }

  // ROM degree values with "norm X" annotation mean out-of-range
  if (/norm\s+[\d-]+/.test(s)) return 'rom_deviation';

  return null;
}

// Map a classification to Tailwind utility classes for the value cell.
// Kept subtle for clinical print — background tint + matching text.
function tintClassFor(cls) {
  switch (cls) {
    case 'wfl':           return 'bg-green-50 text-green-800 border border-green-200';
    case 'neg':           return 'bg-blue-50 text-blue-700 border border-blue-200';
    case 'dtr_normal':    return 'bg-green-50 text-green-800 border border-green-200';
    case 'mild':          return 'bg-amber-50 text-amber-800 border border-amber-300';
    case 'mod':           return 'bg-orange-50 text-orange-800 border border-orange-300';
    case 'sig':           return 'bg-red-50 text-red-800 border border-red-300';
    case 'pos':           return 'bg-red-50 text-red-800 border border-red-300';
    case 'weak':          return 'bg-amber-50 text-amber-800 border border-amber-300';
    case 'dtr_abnormal':  return 'bg-amber-50 text-amber-800 border border-amber-300';
    case 'rom_deviation': return 'bg-amber-50 text-amber-800 border border-amber-300';
    default: return '';
  }
}

// Inline-block pill style for tinted values so the color chip hugs the text.
function valueCellCls(v) {
